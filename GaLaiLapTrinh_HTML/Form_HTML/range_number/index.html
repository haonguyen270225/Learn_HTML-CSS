<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học form : type = "range" và type = "number" !</title>
  </head>
  <body>
    <h1>1.Range</h1>
    <form action="">
      <label>
        range :
        <input
          type="range"
          name="range_input"
          id="range_input"
          min="0"
          max="100"
          step="3"
          value="5"
        />
        <button>Gửi !</button>
      </label>
    </form>
    <h1>2.Number</h1>
    <form action="">
      <label>
        number :
        <input
          type="number"
          name="number_input"
          id="number_input"
          min="0"
          max="100"
          step="3"
          value="5"
        />
        <button>Gửi !</button>
      </label>
    </form>
  </body>
</html>
