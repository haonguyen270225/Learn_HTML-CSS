<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giới thiệu thẻ form - Biểu mẫu nhập liệu !</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form action="">
      <label id = "label_first_name" for="first_name">Nhập họ : </label>
      <input
        id="first_name"
        name="first_name"
        type="text"
        placeholder="Nguyễn"
        required
      />
      <br />
      <label for="pass_word">Nhập mật khẩu : </label>
      <input
        type="password"
        id="pass_word"
        placeholder="aaaaa"
        name="pass_word"
        required
      />
      <br />
      <input id="sumit_btn" type="submit" value="Gửi !" />
    </form>
  </body>
</html>
