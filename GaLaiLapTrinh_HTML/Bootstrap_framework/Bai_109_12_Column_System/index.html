<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Học bootstrap : 12 Column System - Hệ thống 12 cột trong Bootstrap !
    </title>
    <!-- bootstrap framework ! -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- style -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- hệ thống cột ! -->
    <div class="container">
      <div class="row mb-3">
        <div class="col border border-primary">1</div>
        <div class="col border border-primary">2</div>
        <div class="col border border-primary">3</div>
        <div class="col border border-primary">4</div>
        <div class="col border border-primary">5</div>
        <div class="col border border-primary">6</div>
        <div class="col border border-primary">7</div>
        <div class="col border border-primary">8</div>
        <div class="col border border-primary">9</div>
        <div class="col border border-primary">10</div>
        <div class="col border border-primary">11</div>
        <div class="col border border-primary">12</div>
      </div>
      <!-- column size -->
      <div class="row mb-3">
        <div class="col-2 border border-primary text-center">2</div>
        <div class="col-4 border border-primary text-center">4</div>
        <div class="col-6 border border-primary text-center">6</div>
      </div>
      <!-- hoặc có thể để cột cuối cùng dùng là col , sẽ tự động chiếm hết phần còn lại ! -->
      <div class="row mb-3">
        <div class="col-2 border border-primary text-center">2</div>
        <div class="col-4 border border-primary text-center">4</div>
        <div class="col border border-primary text-center">6</div>
      </div>

      <!-- column size với breakpoint -->
      <div class="row mb-3">
        <div class="col-sm-2 border border-primary text-center">2</div>
        <div class="col-sm-4 border border-primary text-center">4</div>
        <div class="col-sm-6 border border-primary text-center">6</div>
      </div>
      <!-- Nếu không thiết lặp số lượng chiếm -> Tự động chia điều các cột ! -->
      <div class="row mb-3">
        <div class="col-sm border border-primary text-center">X</div>
        <div class="col-sm border border-primary text-center">X</div>
        <div class="col-sm border border-primary text-center">X</div>
      </div>
      <!-- một col có thể đặt nhiều breakpoints ! -->
     <div class="row mb-3">
      <div class="col-ms-12 col-md-8 col-xl-4 border border-primary text-center">X</div>
     </div>
    </div>

    <button class="btn btn-primary">aefaefaef</button>
    <!-- script Bootstrap  -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
