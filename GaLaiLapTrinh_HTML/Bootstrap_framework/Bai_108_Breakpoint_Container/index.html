<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học bootstrap : Breakpoint - Container !</title>
    <!-- bootstrap framework ! -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- style -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container bg-primary p-2 mb-3">.container</div>
    <div class="container-sm bg-primary p-2 mb-3">.container-sm</div>
    <div class="container-md bg-primary p-2 mb-3">.container-md</div>
    <div class="container-lg bg-primary p-2 mb-3">.container-lg</div>
    <div class="container-xl bg-primary p-2 mb-3">.container-xl</div> 
    <div class="container-xxl bg-primary p-2 mb-3">.container-xxl</div>
    <div class="container-fluid bg-primary p-2 mb-3">.container-fluid</div>
    <!-- script Bootstrap  -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
