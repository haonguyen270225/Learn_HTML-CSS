<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học framework bootstrap : Color !</title>
    <!-- bootstrap framework ! -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- Sử dụng Color trong Bootstrap ! -->
    <p class="text-primary">.text-primary</p>
    <p class="text-secondary">.text-secondary</p>
    <p class="text-success">.text-success</p>
    <p class="text-danger">.text-danger</p>
    <!-- tùy chỉnh độ trong suốt ! -->
    <p class="text-danger text-opacity-70">.text-danger</p>
    <p class="text-danger text-opacity-50">.text-danger</p>
    <p class="text-danger text-opacity-25">.text-danger</p>

    <!-- Tùy chỉnh độ tromg suốt ! -->
    <p class="text-danger" style="--bs-text-opacity: 0.7">.text-danger</p>
    <p class="text-danger" style="--bs-text-opacity: 0.5">.text-danger</p>
    <p class="text-danger" style="--bs-text-opacity: 0.2">.text-danger</p>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
