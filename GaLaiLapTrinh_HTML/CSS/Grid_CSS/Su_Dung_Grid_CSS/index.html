<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học CSS : Grid CSS - Lưới trong CSS !</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Muốn sử dụng Grid ta cần bao quan nó 1 class cha và dùng thuộc tính display : grid or display inline-grid; trên class cha ! -->
    <!-- emmet : .container>.box.box${Itemn $}*5 -->
    <div class="container">
      <div class="box box1">Itemn 1</div>
      <div class="box box2">Itemn 2</div>
      <div class="box box3">Itemn 3</div>
      <div class="box box4">Itemn 4</div>
      <div class="box box5">Itemn 5</div>
    </div>
  </body>
