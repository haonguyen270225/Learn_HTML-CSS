<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học thuộc tính CSS : position:relative !</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Thuộc tính position : relative -> Dùng để định vị vị trí của phần tử ban đầu của nó
     một khoản x
     top -> cách lề trên 1 khoản x
     bottom -> cách lề dưới 1 khoản x
     left -> cạch lề trái một khoản x
     right -> cách lề phải một khoản x
      -->
    <div class="content">
      <div class="box box1">Khối 1</div>
      <div class="box box2">Khối 2</div>
      <div class="box box3">Khối 3</div>
      <h1>Nguyễn Văn A Học lập trình web !</h1>
    </div>
  </body>
</html>
