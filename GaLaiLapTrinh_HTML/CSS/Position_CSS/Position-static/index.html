<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học thuộc tính CSS : position:static !</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Thuộc tính position : static; Default - là thuộc tính mặc định của position !
    - Thuộc tính position cho phép điều chỉnh vị trí các phần tử trên trang web.
    - position có 5 giá trí sau : static - mặc định , relative , absolute , fixed , sticky. 
    -->
    <div class="content">
      <div class="box box1">Khối 1</div>
      <div class="box box2">Khối 2</div>
      <div class="box box3">Khối 3</div>
      <h1>Nguyễn Văn A học lặp trình web !</h1>
    </div>
  </body>
</html>
