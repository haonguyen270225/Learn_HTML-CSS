<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học thuộc tính CSS : z-index !</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- z-index -> giúp xác định  phần tử nào nằm cao hơn phần tử nào !
     Các phần tử có z-index thấp hơn có thể bị che khuất !
     * Chú ý :
     1. Các phần tử phải có cùng position (vị trí) được định nghĩa như : relative , absolute , fixed.
     2. Các phần tử có position:static (mặc định ) không bị ảnh hưởng bởi z-index.
     -->

    <div class="content">
      <div class="box box1">Khối 1</div>
      <div class="box box2">Khối 2</div>
      <div class="box box3">Khối 3</div>
    </div>
  </body>
</html>
