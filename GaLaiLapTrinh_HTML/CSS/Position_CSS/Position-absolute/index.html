<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học thuộc tính CSS : position : absolute !</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Thuộc tính position : absolute; -> Phần tử thực sự được đưa ra khỏi luồng (lớp) ban đầu !
     * Các trính chất :
     1. Nếu phần tử không có tổ tiên (các thẻ cha , ông , cố , ...) có position : relative thì phần tử được
     định vị theo top left corner webpage (góc trên bên trái của trang web).
     2. Phần tử được định vị theo tổ tiên gần nhất có đặt position : relative .
       -->
    <div class="head">
      <div class="content">
        <div class="box box1">Khối 1</div>
        <div class="box box2">Khối 2</div>
        <div class="box box3">Khối 3</div>
        <h1>Nguyễn Văn A học lập trình web !</h1>
      </div>
    </div>
  </body>
</html>
