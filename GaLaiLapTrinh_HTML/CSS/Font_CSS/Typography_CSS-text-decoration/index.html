<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học kiểu chữ (Typograpy) trong CSS : text-decoration !</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Thuộc tính text-decoration chỉ định kiểu gạch trên text ! -->
    <h1>Học lập trình web cùng Nguyễn Văn A !</h1>
    <p class="line1">Dòng thứ 1</p>
    <p class="line2">Dòng thứ 2</p>
    <p class="line3">25.000 vn</p>
    <p class="line4">Dòng thứ 4</p>
    <p class="line5">Dòng thứ 5</p>
  </body>
</html>
