<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học Attribute Selector : Bộ chọn theo thuộc tính !</title>
    <link rel="stylesheet" href="stylestyle.css">
  </head>
  <body>
    <!-- Bộ chọn [Attribute] -->
    <a href="https://www.youtube.com/">Click vào 1</a>
    <a href="https://www.youtube.com/" target="_blank">Click vào 2</a>
    <a href="https://www.youtube.com/" target="_self">Click vào 3</a>
    <p href>Đoạn văn 1</p>
    <p>Đoạn văn 2</p>
  </body>
</html>
