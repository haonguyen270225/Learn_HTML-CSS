    <!-- Hàm calc() trong css dùng đề tính toán đơn giản như : + , - , * , / !
    - Chú ý :
    - Sử dụng toán tử + , - phía trước vá sau phải có khoản cách !
    - phía sau calc không chứa dấu cách như : cals () -> không hợp lệ !
    - Khi dùng * : Thì đơn vị để phía trước or sau đều được 
    ví dụ : width : calc(100px * 2); or calc(2 * 100px) đèu được !
    - Khi dùng / :
    Không chía cho 0.
    width: (100% / 0); -> không được !
    Phải để đơn  vị trước !.
    ví dụ :
    width: calc(100% / 2);
    width: calc(2 / 100%) -> không được !
    -->
