<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học thuộc tính CSS : flex-basis !</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- flex-basis : 30%
    -> Dùng để chỉ định chiều dài item theo trục main axis.
    - Trước khi dùng flex-direction : column/column-reverse -> flex-basis tương đương width.
    - Khi dùng flex-direction : column/column-reverse -> flex-basis quy định chiều cao (theo trục main axis bị thay đổi) , width quy định chiều dài . 
    -->
    <div class="container">
      <div class="box box1">Block 1</div>
      <div class="box box2">Block 2</div>
      <div class="box box3">Block 3</div>
    </div>
  </body>
</html>
