<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học thuộc tính CSS : align-content !</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- align-content : strecth/flex-start/flex-end/center/space-around/space-between;
     -> Dùng để căn chỉnh nhiều hàng trên trục cross axis !
     * Chú ý : Thuộc tính align-content đi kèm với flex-wrap;
     -->
    <!-- emmet : .container>.box.box${Block $}*8 -->
    <div class="container">
      <div class="box box1">Block 1</div>
      <div class="box box2">Block 2</div>
      <div class="box box3">Block 3</div>
      <div class="box box4">Block 4</div>
      <div class="box box5">Block 5</div>
      <div class="box box6">Block 6</div>
      <div class="box box7">Block 7</div>
      <div class="box box8">Block 8</div>
    </div>
  </body>
</html>
