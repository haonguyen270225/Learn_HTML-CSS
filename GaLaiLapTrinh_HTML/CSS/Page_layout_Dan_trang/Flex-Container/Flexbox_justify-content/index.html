<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học Flexbox : justify-content !</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Thuộc tính justify-content : justify-start/justify-end/center/space-between/space-around/space-evenly !
    -> Dùng để định vị các item trong container theo trúc main axis ! 
    -->
    <div class="container">
      <div class="box box1">Block 1</div>
      <div class="box box2">Block 2</div>
      <div class="box box3">Block 3</div>
      <div class="box box4">Block 4</div>
      <div class="box box5">Block 5</div>
    </div>
  </body>
</html>
