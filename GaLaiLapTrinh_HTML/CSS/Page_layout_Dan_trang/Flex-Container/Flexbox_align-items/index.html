<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học thuộc tính CSS : align-items !</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- align-items : stretch/flex-start/flex-end/center/baseline;
    -> Dùng để  định vị vị trí các item theo trục cross axis !
     -->
    <!-- emmet : .container>.box.box${Blok $}*5 -->
    <div class="container">
      <div class="box box1">Blok 1</div>
      <div class="box box2">Blok 2</div>
      <div class="box box3">Blok 3</div>
      <div class="box box4">Blok 4</div>
      <div class="box box5">Blok 5</div>
    </div>
  </body>
</html>
