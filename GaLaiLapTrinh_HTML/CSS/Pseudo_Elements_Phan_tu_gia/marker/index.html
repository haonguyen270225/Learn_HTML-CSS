<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học (Pseudo element) phần tử giả li::marker !</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- li::marker -> Giúp chọn các điểm đánh dấu của các phần tử li ! -->
    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ul>

    <ol>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ol>
  </body>
</html>
