<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học bộ chọn : + selector và ~ selector !</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Sử dụng + selector để tác động đến phần tử đứng ngay sau ! -->
    <h1>Thông tin cá nhân !</h1>
    <h2 class="demo">Bạn tên là gì ?</h2>
    <h3 class="demo demo2">Bạn sống ở đâu !</h3>
    <h3>Bạn có phải là sinh viên !</h3>
    <p>Bạn là sinh viên ngành gì !</p>

    <!-- Sử dụng : ~ để tác động đến phần tử  đứng sau ! -->
    <div>
      <p>Chúc bạn may mắn !</p>
    </div>
    <div class="loi_chuc">
      <p>Chúc bạn thành công !</p>
    </div>
    <div>
      <p>Thượng lộ bình án !</p>
    </div>
    <p>Tiền vô đầy túi !</p>
  </body>
</html>
