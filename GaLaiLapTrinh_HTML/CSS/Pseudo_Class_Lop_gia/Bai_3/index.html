<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Bài 3 : Học Pseudo class - lớp giả !</title>
  </head>
  <body>
    <div>
      <p>Đoạn văn 1!</p>
      <!-- Đây là thẻ p là thẻ con đầu tiên ! -->
      <p>Đoạn văn 2!</p>
      <p>Đoạn văn 3!</p>
      <p>Đoạn văn 4!</p>
      <p>Đoạn văn 5!</p>
    </div>

    <div class="demo_class">
      <h1>Thẻ nội dung !</h1>
      <!-- Ở đây thẻ p không phải là thẻ con đầu tiên ! -->
      <p>Nội dung 1 !</p>
      <p>Nội dung 2 !</p>
      <p>Nội dung 3 !</p>
      <p>Nội dung 4 !</p>
      <!-- Ở đây thẻ p không phải la thẻ con cuối dùng ! -->
      <h2>Thẻ nội dung !</h2>
    </div>
    <div>
      <p>Thẻ con duy nhất !</p>
    </div>
    <div>
      <p>Không phải thẻ con duy nhất !</p>
      <h2>Đã có thẻ h2 nên thẻ p không phải thẻ con duy nhất !</h2>
    </div>
  </body>
</html>
